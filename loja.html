<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nay Semi Joias | Loja</title>
<link rel="stylesheet" href="loja.css">
</head>
<body>
<header>
  <div class="topo">
    <img class="logo" src="logo.jpg" alt="Nayara Oliveira Semi Joias">
    <nav>
      <a href="index.html">Início</a>
      <a href="loja.html">Loja</a>
    </nav>
    <button class="carrinho-btn" id="abrir-carrinho">🛒 Meu carrinho (<span id="contador-carrinho">0</span>)</button>
  </div>
</header>
<section class="hero">
  <h1>Nay Semi Joias</h1>
  <p>Mais que acessórios, é sobre você!</p>
  <p class="destaques">ELEGÂNCIA • QUALIDADE • ESTILO</p>
</section>
<div class="controles">
  <select id="filtro-categoria">
    <option>Todos</option><option>Chokers</option><option>Colares</option><option>Pulseiras</option>
    <option>Brincos</option><option>Conjuntos</option><option>Piercings</option><option>Tornozeleiras</option>
  </select>
  <input id="busca-produtos" type="search" placeholder="Buscar uma peça...">
</div>
<main id="produtos-grid" class="grid"></main>
<footer><strong>Nay Semi Joias</strong><br>Beleza • Qualidade • Confiança</footer>

<div class="modal" id="modal-carrinho">
  <div class="painel">
    <div class="painel-topo"><h2>Meu carrinho</h2><button id="fechar-carrinho">×</button></div>
    <div id="lista-carrinho"></div>
    <div class="total">Total: <span id="total-carrinho">R$ 0,00</span></div>
    <button class="finalizar" id="finalizar-whatsapp">Finalizar pelo WhatsApp</button>
  </div>
</div>
<script src="produtos.js"></script>
</body>
</html>
