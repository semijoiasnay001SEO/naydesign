name: Fotos obrigatórias

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-fotos:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Listar fotos IMG
        run: |
          echo "=== FOTOS IMG ENCONTRADAS ==="

          fotos=$(find . -type f -iname 'IMG-*.jpg' | sort)

          if [ -z "$fotos" ]; then
            echo "Nenhuma foto IMG encontrada."
            exit 0
          fi

          echo "$fotos"

          echo ""
          echo "=== TOTAL ==="
          echo "$fotos" | wc -l

          echo ""
          echo "⚠️ NENHUM ARQUIVO FOI APAGADO."
